name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Read FPF version
        id: fpf
        run: echo "sha=$(cat FPF_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build binaries
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p dist
          for target in darwin/arm64 darwin/amd64 linux/amd64 linux/arm64; do
            OS="${target%%/*}"
            ARCH="${target##*/}"
            OUT="dist/fpf-rag-${OS}-${ARCH}"
            echo "Building $OUT..."
            GOOS=$OS GOARCH=$ARCH go build \
              -ldflags "-s -w -X main.version=$VERSION" \
              -o "$OUT" ./cmd/fpf-rag
          done

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/fpf-rag-*
          body: |
            ## FPF Spec Update

            Built from FPF upstream commit: [`${{ steps.fpf.outputs.sha }}`](https://github.com/ailev/FPF/commit/${{ steps.fpf.outputs.sha }})

            ### Install

            ```bash
            curl -fsSL https://raw.githubusercontent.com/m0n0x41d/claude-code-fpf/main/install.sh | bash
            ```

            ### Binaries

            | Platform | Binary |
            |----------|--------|
            | macOS (Apple Silicon) | `fpf-rag-darwin-arm64` |
            | macOS (Intel) | `fpf-rag-darwin-amd64` |
            | Linux (x86_64) | `fpf-rag-linux-amd64` |
            | Linux (ARM64) | `fpf-rag-linux-arm64` |
          generate_release_notes: true
